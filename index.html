<!DOCTYPE html>
<html>
<head>
    <title>Craftcoin Portal</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        input, button { margin: 5px 0; padding: 8px; width: 100%; box-sizing: border-box; }
        hr { margin: 20px 0; }
        #mining-status { color: #00875a; font-weight: bold; margin: 5px 0; }
        #leaderboard-area { background: #f4f5f7; padding: 15px; border-radius: 5px; margin-top: 15px; }
        .leaderboard-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #ddd; }
    </style>
</head>
<body>
    <h2>Craftcoin Network (meme)</h2>
    <h3>Note: Asher is a loser</h3>
    <h4>Created by ken</h4>
    
    <input id="user" placeholder="Username"><br>
    <input id="pass" type="password" placeholder="Password"><br>
    
    <button onclick="doAction('create_account')">Create Account</button>
    <button onclick="doAction('get_balance')">Check Balance</button>
    <button onclick="startSimpleMining()">Mine (1/1000 Win Rate)</button>
    <div id="mining-status"></div>
    
    <button onclick="fetchLeaderboard()" style="background-color: #0076ff; color: white; margin-top: 10px;">View Leaderboard</button>
    
    <div id="leaderboard-area" style="display:none;">
        <h3>Top Balances</h3>
        <div id="leaderboard-list"></div>
    </div>
    
    <hr>
    <input id="to" placeholder="Recipient"><br>
    <input id="amt" type="number" placeholder="Amount"><br>
    <button onclick="doAction('transfer')">Transfer</button>
    
    <p id="output"></p>

    <script>
        const WORKER_URL = 'https://workers.dev';

        async function doAction(action, extraData = {}) {
            const output = document.getElementById('output');
            output.innerText = "Processing...";
            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: action,
                        username: document.getElementById('user').value,
                        password: document.getElementById('pass').value,
                        recipient: document.getElementById('to').value,
                        amount: document.getElementById('amt').value,
                        ...extraData
                    })
                });
                const result = await response.text();
                output.innerText = result;
                return result;
            } catch (err) {
                output.innerText = "Connection Error: " + err.message;
            }
        }

        async function startSimpleMining() {
            const username = document.getElementById('user').value.toLowerCase().trim();
            const statusDiv = document.getElementById('mining-status');
            const output = document.getElementById('output');
            
            if (!username) {
                alert("Please enter a username to mine coins!");
                return;
            }
            
            statusDiv.style.color = "#00875a"; // Reset to green
            statusDiv.innerText = "Rolling a 1-1000 dice...";
            
            const luckyGuess = Math.floor(Math.random() * 1000) + 1;
            statusDiv.innerText = `You rolled: ${luckyGuess}! Submitting to server...`;
            
            output.innerText = "Processing...";
            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'mine_guess',
                        username: username,
                        password: document.getElementById('pass').value,
                        guess: luckyGuess.toString()
                    })
                });
                
                const result = await response.text();
                output.innerText = result;
                
                if (response.status === 429) {
                    statusDiv.style.color = "#de350b"; // Turn text red on throttling
                    statusDiv.innerText = "Throttled: Too many global requests!";
                }
            } catch (err) {
                output.innerText = "Connection Error: " + err.message;
            }
        }

        async function fetchLeaderboard() {
            const listDiv = document.getElementById('leaderboard-list');
            const areaDiv = document.getElementById('leaderboard-area');
            listDiv.innerHTML = "Loading...";
            areaDiv.style.display = "block";
            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'get_leaderboard' })
                });
                const data = await response.json();
                listDiv.innerHTML = "";
                if (data.length === 0) {
                    listDiv.innerHTML = "No accounts found.";
                    return;
                }
                data.forEach((user, index) => {
                    listDiv.innerHTML += `
                    <div class="leaderboard-row">
                        <span><strong>#${index + 1}</strong> ${user.username}</span>
                        <span>${user.balance} CC</span>
                    </div>`;
                });
            } catch (err) {
                listDiv.innerHTML = "Failed to load leaderboard data.";
            }
        }
    </script>
</body>
</html>
