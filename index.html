<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Craftcoin Portal</title>
    <style>
        /* Base Setup */
        html, body {
            margin: 0;
            padding: 0;
            background-color: black;
            font-family: sans-serif;
            /* Ensures scrollbars appear naturally when cards exceed heights */
            overflow-y: auto; 
            min-height: 100vh;
        }
        
        /* Fixed Background Screen Canvas */
        #logo {
            position: fixed; 
            width: 150px;
            height: 70px;
            background-color: #00ff00;
            color: black;
            font-family: 'Arial Black', Impact, sans-serif;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            z-index: 1; /* Behind inputs */
            border-radius: 4px;
        }

        /* Scrollable Layout Container Wrapper */
        .portal-container {
            position: relative;
            z-index: 10; /* Keeps all cards, inputs, and buttons clickable */
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .card { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            margin-bottom: 20px; 
        }
        
        input, button { 
            margin: 6px 0; 
            padding: 10px; 
            width: 100%; 
            box-sizing: border-box; 
            border-radius: 4px; 
            border: 1px solid #ccc; 
            font-size: 14px; 
        }
        
        button { 
            background-color: #0052cc; 
            color: white; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
            transition: background 0.2s; 
        }
        
        button:hover { background-color: #0076ff; }
        .btn-secondary { background-color: #7a869a; }
        .btn-secondary:hover { background-color: #97a0af; }
        hr { margin: 20px 0; border: 0; border-top: 1px solid #eee; }
        #mining-status { font-weight: bold; margin: 8px 0; min-height: 20px; }
        #leaderboard-area { background: #f4f5f7; padding: 15px; border-radius: 5px; margin-top: 15px; border: 1px solid #dfe1e6; color: #333; }
        .leaderboard-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #dfe1e6; }
        .leaderboard-row:last-child { border-bottom: none; }
        #output { padding: 12px; border-radius: 4px; background: #eaeaea; font-family: monospace; white-space: pre-wrap; word-break: break-all; margin-top: 15px; color: #333; }
        .status-success { color: #00875a; font-weight: bold; }
        .status-error { color: #de350b; font-weight: bold; }
        .status-pending { color: #4c9aff; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Bouncing logo is fixed to viewport space underneath -->
    <div id="logo">CRC</div>

    <!-- Main portal wrapper that expands document length cleanly -->
    <div class="portal-container">
        <div class="card">
            <h2 style="margin-top:0; color:#333;">Craftcoin Network (meme)</h2>
            <h3 style="color:#de350b;">Note: Asher is a loser</h3>
            <h4 style="color:#7a869a;">Created by ken</h4>
            
            <input id="user" placeholder="Username" autocomplete="username"><br>
            <input id="pass" type="password" placeholder="Password" autocomplete="current-password"><br>
            
            <button onclick="doAction('create_account')">Create Account</button>
            <button onclick="doAction('get_balance')" class="btn-secondary">Check Balance</button>
            <button onclick="startSimpleMining()" style="background-color: #00875a;">Mine Craftcoin</button>
            <div id="mining-status"></div>
            
            <button onclick="fetchLeaderboard()" style="background-color: #4c9aff; margin-top: 10px;">View Leaderboard</button>
            
            <div id="leaderboard-area" style="display:none;">
                <h3>Top Balances</h3>
                <div id="leaderboard-list"></div>
            </div>
        </div>
        
        <div class="card">
            <h3 style="margin-top:0; color:#333;">Transfer Funds</h3>
            <input id="to" placeholder="Recipient Username"><br>
            <input id="amt" type="number" step="any" min="0.01" placeholder="Amount (e.g. 5.0)"><br>
            <button onclick="handleTransfer()" style="background-color: #de350b;">Transfer Coins</button>
        </div>

        <div id="output">System status: Ready</div>
    </div>

    <script>
        // ------------------ PLATFORM API INTEGRATION ------------------
        const WORKER_URL = 'https://craftcoinmeme.andrewk-124710.workers.dev';

        function updateOutput(text, className = '') {
            const out = document.getElementById('output');
            out.innerText = text;
            out.className = className;
        }

        function getAuthCredentials() {
            const u = document.getElementById('user').value.toLowerCase().trim();
            const p = document.getElementById('pass').value;
            return { username: u, password: p };
        }

        async function doAction(action, extraData = {}) {
            const { username, password } = getAuthCredentials();
            
            if (!username || !password) {
                updateOutput("Error: Username and Password fields are required.", "status-error");
                return;
            }

            updateOutput("Processing request...", "status-pending");
            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: action,
                        username: username,
                        password: password,
                        ...extraData
                    })
                });
                
                const result = await response.text();
                const statusClass = response.ok ? "status-success" : "status-error";
                updateOutput(result, statusClass);
                return response;
            } catch (err) {
                updateOutput("Network Error: " + err.message, "status-error");
            }
        }

        async function startSimpleMining() {
            const { username, password } = getAuthCredentials();
            const statusDiv = document.getElementById('mining-status');
            
            if (!username || !password) {
                updateOutput("Error: Enter credentials to mine coins.", "status-error");
                return;
            }
            
            statusDiv.className = "status-pending";
            statusDiv.innerText = "Requesting server to roll random mining attempt...";
            updateOutput("Mining transaction pending...", "status-pending");
            
            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'mine_guess',
                        username: username,
                        password: password
                    })
                });
                
                const result = await response.text();
                updateOutput(result, response.ok ? "status-success" : "status-error");
                
                if (response.status === 429) {
                    statusDiv.className = "status-error";
                    statusDiv.innerText = "Rate limited! Wait a moment and try again.";
                } else if (result.includes("Jackpot!")) {
                    statusDiv.className = "status-success";
                    statusDiv.innerText = "Success! Gained 5.0 Craftcoins!";
                } else {
                    statusDiv.className = "status-error";
                    statusDiv.innerText = "Missed! Better luck next roll.";
                }
            } catch (err) {
                statusDiv.className = "status-error";
                statusDiv.innerText = "Connection failed.";
                updateOutput("Network Error: " + err.message, "status-error");
            }
        }

        async function handleTransfer() {
            const recipient = document.getElementById('to').value.toLowerCase().trim();
            const amountInput = document.getElementById('amt').value;
            const amount = parseFloat(amountInput);
            
            if (!recipient) {
                updateOutput("Error: Recipient username required.", "status-error");
                return;
            }
            if (isNaN(amount) || amount <= 0) {
                updateOutput("Error: Enter a valid transaction amount greater than 0.", "status-error");
                return;
            }

            await doAction('transfer', {
                recipient: recipient,
                amount: amount
            });
        }

        async function fetchLeaderboard() {
            const listDiv = document.getElementById('leaderboard-list');
            const areaDiv = document.getElementById('leaderboard-area');
            listDiv.innerHTML = "<em>Loading leaderboard stats...</em>";
            areaDiv.style.display = "block";
            
            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'get_leaderboard' })
                });
                
                const result = await response.text();
                listDiv.innerHTML = result;
            } catch (err) {
                listDiv.innerHTML = "Error loading leaderboard.";
            }
        }

        // ------------------ DVD SCREENSAVER ANIMATION LOOP ------------------
        const logo = document.getElementById('logo');
        
        let x = Math.random() * (window.innerWidth - 150);
        let y = Math.random() * (window.innerHeight - 70);
        
        let dx = 3;
        let dy = 3;

        const colors = ['#00ff00', '#ff00ff', '#00ffff', '#ffff00', '#ff0000', '#0000ff', '#ffffff'];

        function changeColor() {
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            logo.style.backgroundColor = randomColor;
        }

        function update() {
            x += dx;
            y += dy;

            const maxX = window.innerWidth - logo.offsetWidth;
            const maxY = window.innerHeight - logo.offsetHeight;

            if (x >= maxX || x <= 0) {
                dx = -dx;
                x = Math.max(0, Math.min(x, maxX));
                changeColor();
            }

            if (y >= maxY || y <= 0) {
                dy = -dy;
                y = Math.max(0, Math.min(y, maxY));
                changeColor();
            }

            logo.style.left = x + 'px';
            logo.style.top = y + 'px';

            requestAnimationFrame(update);
        }

        window.addEventListener('resize', () => {
            x = Math.max(0, Math.min(x, window.innerWidth - logo.offsetWidth));
            y = Math.max(0, Math.min(y, window.innerHeight - logo.offsetHeight));
        });

        changeColor();
        update();
    </script>
</body>
</html>
