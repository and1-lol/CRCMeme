<!DOCTYPE html>
<html>
<head>
    <title>The Craftcoin Network   (meme)      </title>
    <title>Created by: ken *Not to be of Value*</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        input, button { margin: 5px 0; padding: 8px; width: 250px; }
        hr { margin: 20px 0; }
        #mining-status { color: #00875a; font-weight: bold; }
    </style>
</head>
<body>
  <h2>Craftcoin Network (meme)</h2>
  <input id="user" placeholder="Username"><br>
  <input id="pass" type="password" placeholder="Password"><br>
  <button onclick="doAction('create_account')">Create Account</button>
  <button onclick="doAction('get_balance')">Check Balance</button>
  <button onclick="startSimpleMining()">⛏️ Mine (Guess Number 1-100)</button>
  <div id="mining-status"></div>
  
  <hr>
  <input id="to" placeholder="Recipient"><br>
  <input id="amt" type="number" placeholder="Amount"><br>
  <button onclick="doAction('transfer')">Transfer</button>

  <p id="output"></p>

  <script>
    const WORKER_URL = 'https://craftcoinmeme.andrewk-124710.workers.dev'; // REPLACE WITH YOUR REAL URL

    async function doAction(action, extraData = {}) {
      const output = document.getElementById('output');
      output.innerText = "Processing...";
      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: action,
            username: document.getElementById('user').value,
            password: document.getElementById('pass').value,
            recipient: document.getElementById('to').value,
            amount: document.getElementById('amt').value,
            ...extraData
          })
        });
        const result = await response.text();
        output.innerText = result;
        return result;
      } catch (err) {
        output.innerText = "Connection Error: " + err.message;
      }
    }

    async function startSimpleMining() {
      const username = document.getElementById('user').value.toLowerCase().trim();
      const statusDiv = document.getElementById('mining-status');
      if (!username) {
        alert("Please enter a username to mine coins!");
        return;
      }

      statusDiv.innerText = "Rolling the dice...";
      
      // Generate a quick local guess number between 1 and 100
      const luckyGuess = Math.floor(Math.random() * 100) + 1;
      
      statusDiv.innerText = `You guessed number: ${luckyGuess}! Submitting to server...`;
      
      // Send the guess directly to your Cloudflare Worker backend
      await doAction('mine_guess', { guess: luckyGuess.toString() });
    }
  </script>
</body>
</html>
